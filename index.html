<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K&B Net Service - Field Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl w-full max-w-md space-y-4">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <div>
                <h1 class="text-base font-extrabold text-white">K&B Net Service</h1>
                <p class="text-[11px] font-medium text-blue-400">Field Operations & Team Portal</p>
            </div>
            <div class="flex gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button onclick="changeLanguage('en')" class="text-[10px] px-2 py-1 rounded-lg font-bold text-slate-400 hover:text-white">EN</button>
                <button onclick="changeLanguage('hi')" class="text-[10px] px-2 py-1 rounded-lg font-bold text-slate-400 hover:text-white">हिंदी</button>
                <button onclick="changeLanguage('gu')" class="text-[10px] px-2 py-1 rounded-lg font-bold text-slate-400 hover:text-white">ગુજરાતી</button>
            </div>
        </div>

        <!-- Login Section -->
        <div id="login-section" class="space-y-3">
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Worker ID</label>
                <input type="text" id="worker-id" placeholder="e.g. kunal" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Assigned Team Group</label>
                <select id="worker-team" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-xs font-medium text-white outline-none">
                    <option value="Team Alpha (Kathwada)">Team Alpha (Kathwada)</option>
                    <option value="Team Beta (Odhav)">Team Beta (Odhav)</option>
                    <option value="Team Gamma (Maintenance)">Team Gamma (Maintenance)</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                <input type="password" id="worker-pass" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none">
            </div>
            <div class="flex gap-2 pt-1">
                <button onclick="handleLogin(false)" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition text-xs shadow-md">
                    Secure Login
                </button>
                <button onclick="handleLogin(true)" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition text-xs shadow-md">
                    🔒 Fingerprint
                </button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="hidden space-y-3">
            <div class="bg-slate-950 border border-slate-800 p-3 rounded-2xl flex items-center justify-between text-xs">
                <div>
                    <p class="text-slate-400 text-[10px]">Worker ID: <span id="display-id" class="font-bold text-white uppercase"></span></p>
                    <p class="font-bold text-purple-400 text-[10px]" id="display-team"></p>
                </div>
                <span id="status-badge" class="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-amber-500/10 text-amber-400">Off-Duty</span>
            </div>

            <button id="btn-start" onclick="startAutoTracking()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-xs">
                <span>🚀</span> Start Shift (08:00 AM - 08:00 PM)
            </button>

            <!-- Tabs -->
            <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-bold text-slate-400">
                <button onclick="switchTab('tickets')" id="tab-btn-tickets" class="flex-1 py-2 rounded-lg bg-blue-600 text-white transition shadow-sm">📋 Tickets</button>
                <button onclick="switchTab('chat')" id="tab-btn-chat" class="flex-1 py-2 rounded-lg hover:text-white transition">💬 Team Chat</button>
            </div>

            <!-- Tab 1: Tickets -->
            <div id="tab-tickets" class="bg-slate-950 border border-slate-800 p-3 rounded-2xl space-y-2">
                <div id="worker-tasks-container" class="space-y-2 max-h-44 overflow-y-auto pr-1">
                    <p class="text-xs text-slate-500 text-center py-2">Loading tasks...</p>
                </div>
            </div>

            <!-- Tab 2: Chat -->
            <div id="tab-chat" class="hidden bg-slate-950 border border-slate-800 p-3 rounded-2xl space-y-2">
                <div id="chat-messages" class="space-y-1.5 max-h-36 overflow-y-auto text-[11px] bg-slate-900 p-2 rounded-xl border border-slate-800">
                    <p class="text-slate-500 text-center">Loading team chat...</p>
                </div>
                <div class="flex gap-1.5">
                    <input type="text" id="chat-input" placeholder="Type message or note..." class="flex-1 px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white outline-none">
                    <button onclick="sendChatMessage()" class="bg-blue-600 text-white px-3 py-2 rounded-xl text-xs font-bold">Send</button>
                </div>
            </div>

            <!-- GPS Watchdog Box -->
            <div id="watchdog-box" class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-center space-y-0.5">
                <p id="gps-info" class="text-xs font-medium text-slate-400">Live GPS: Waiting...</p>
                <p class="text-[10px] text-slate-500">Working Hours: 08:00 to 20:00 IST</p>
            </div>
            
            <button onclick="handleLogout()" class="text-xs font-semibold text-rose-400 hover:text-rose-300 transition block mx-auto pt-1">
                End Shift & Logout
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCM8iR9ImDzNSDcshdfdLM3DFoF_0LoZYQ",
            authDomain: "attendence-app-16fe2.firebaseapp.com",
            databaseURL: "https://attendence-app-16fe2-default-rtdb.firebaseio.com",
            projectId: "attendence-app-16fe2",
            storageBucket: "attendence-app-16fe2.firebasestorage.app",
            messagingSenderId: "134704010091",
            appId: "1:134704010091:web:7d780f96de0dbf9cd8322e",
            measurementId: "G-2GCE4C3NQ9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let watchId = null;
        let activeWorkerId = "";
        let activeWorkerTeam = "";
        let previousTaskCount = 0;
        let lastGpsPingTime = Date.now();
        let watchdogTimer = null;
        let batteryLevel = 100;

        if (navigator.getBattery) {
            navigator.getBattery().then(b => { batteryLevel = Math.round(b.level * 100); });
        }

        function switchTab(tab) {
            if (tab === 'tickets') {
                document.getElementById('tab-tickets').classList.remove('hidden');
                document.getElementById('tab-chat').classList.add('hidden');
                document.getElementById('tab-btn-tickets').className = "flex-1 py-2 rounded-lg bg-blue-600 text-white transition shadow-sm";
                document.getElementById('tab-btn-chat').className = "flex-1 py-2 rounded-lg hover:text-white transition";
            } else {
                document.getElementById('tab-chat').classList.remove('hidden');
                document.getElementById('tab-tickets').classList.add('hidden');
                document.getElementById('tab-btn-chat').className = "flex-1 py-2 rounded-lg bg-blue-600 text-white transition shadow-sm";
                document.getElementById('tab-btn-tickets').className = "flex-1 py-2 rounded-lg hover:text-white transition";
                loadTeamChat();
            }
        }

        function handleLogin(useBio) {
            activeWorkerId = document.getElementById('worker-id').value.trim().toLowerCase();
            activeWorkerTeam = document.getElementById('worker-team').value;
            const pass = document.getElementById('worker-pass').value.trim();

            if (!activeWorkerId) { alert("Enter Worker ID."); return; }
            if (useBio) {
                alert("Fingerprint verified!");
                proceedLogin();
            } else {
                if (pass !== "123456") { alert("Incorrect password!"); return; }
                proceedLogin();
            }
        }

        function proceedLogin() {
            db.ref('workers/' + activeWorkerId).update({ workerId: activeWorkerId, teamGroup: activeWorkerTeam, lastLogin: new Date().toISOString() }).then(() => {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('display-id').innerText = activeWorkerId;
                document.getElementById('display-team').innerText = activeWorkerTeam;
                loadAssignedTasks();
            });
        }

        function startAutoTracking() {
            const currentHour = new Date().getHours();
            if (currentHour < 8 || currentHour >= 20) {
                alert("⚠️ Shift start denied! Working hours are strictly 08:00 AM to 08:00 PM.");
                return;
            }

            const startBtn = document.getElementById('btn-start');
            startBtn.disabled = true;
            startBtn.className = "w-full bg-slate-800 text-emerald-400 font-bold py-3 px-4 rounded-2xl cursor-not-allowed text-xs flex items-center justify-center gap-2 border border-emerald-500/20";
            startBtn.innerHTML = "<span>🟢</span> Shift Active & Tracking";

            document.getElementById('status-badge').className = "px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-emerald-500/10 text-emerald-400";
            document.getElementById('status-badge').innerText = "Active Shift";

            startGpsWatchdog();

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    lastGpsPingTime = Date.now();
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const accuracy = Math.round(pos.coords.accuracy);
                    const timestamp = new Date().toISOString();

                    const payload = { workerId: activeWorkerId, teamGroup: activeWorkerTeam, status: "ACTIVE", latitude: lat, longitude: lng, accuracy, batteryLevel, lastUpdated: timestamp };
                    db.ref('attendance/' + activeWorkerId + '/latest').set(payload);
                    db.ref('attendance/' + activeWorkerId + '/logs').push({ latitude: lat, longitude: lng, accuracy, timestamp });

                    document.getElementById('gps-info').innerText = `Lat/Lng: ${lat.toFixed(4)}, ${lng.toFixed(4)} (±${accuracy}m)`;
                },
                (err) => { alert("GPS Signal Lost"); },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
            );
        }

        function startGpsWatchdog() {
            if (watchdogTimer) clearInterval(watchdogTimer);
            watchdogTimer = setInterval(() => {
                const diffMins = (Date.now() - lastGpsPingTime) / 60000;
                if (diffMins >= 5 && diffMins < 10) {
                    document.getElementById('gps-info').innerText = "⚠️ Warning: GPS signal dropped!";
                    if (navigator.vibrate) navigator.vibrate([300, 200, 300]);
                } else if (diffMins >= 10) {
                    document.getElementById('gps-info').innerText = "❌ Flagged Absent: 10 mins without GPS!";
                    db.ref('attendance/' + activeWorkerId + '/latest').update({ status: "FLAGGED_ABSENT" });
                }
            }, 30000);
        }

        function loadAssignedTasks() {
            db.ref('tasks').on('value', snap => {
                const container = document.getElementById('worker-tasks-container');
                container.innerHTML = "";
                if (!snap.exists()) { container.innerHTML = `<p class="text-xs text-slate-500 text-center py-2">No tickets assigned.</p>`; return; }

                let count = 0;
                snap.forEach(child => {
                    const id = child.key;
                    const t = child.val();
                    if ((t.assignType === 'worker' && t.target === activeWorkerId) || (t.assignType === 'team' && t.target === activeWorkerTeam)) {
                        count++;
                        const navUrl = t.custAddress ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.custAddress)}` : '#';

                        container.innerHTML += `
                            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-1.5 text-xs">
                                <div class="flex justify-between items-center font-bold text-white">
                                    <span>🛠️ ${t.title}</span>
                                    <span class="px-2 py-0.5 rounded text-[10px] bg-blue-500/10 text-blue-400">${t.status}</span>
                                </div>
                                <p class="text-slate-400 text-[11px]">👤 ${t.custName || 'N/A'} | 📍 ${t.custAddress || 'N/A'}</p>
                                <div class="flex gap-2 pt-1">
                                    ${t.custPhone ? `<a href="tel:${t.custPhone}" class="flex-1 bg-emerald-500/10 text-emerald-400 font-bold text-center py-1 rounded-lg border border-emerald-500/20 text-[11px]">📞 Call</a>` : ''}
                                    ${t.custAddress ? `<a href="${navUrl}" target="_blank" class="flex-1 bg-blue-500/10 text-blue-400 font-bold text-center py-1 rounded-lg border border-blue-500/20 text-[11px]">🗺️ Map</a>` : ''}
                                </div>
                                <div class="flex gap-2 pt-1 border-t border-slate-800">
                                    <button onclick="updateTaskStatus('${id}', 'In Progress')" class="flex-1 bg-blue-600 text-white font-semibold py-1 rounded-lg text-[10px]">Start</button>
                                    <label class="flex-1 bg-emerald-600 text-white font-semibold py-1 rounded-lg text-[10px] text-center cursor-pointer">
                                        Complete 📷 <input type="file" accept="image/*" capture="environment" class="hidden" onchange="uploadPhoto(event, '${id}')">
                                    </label>
                                </div>
                            </div>`;
                    }
                });
                if (count > previousTaskCount && previousTaskCount !== 0) playChime();
                previousTaskCount = count;
            });
        }

        function loadTeamChat() {
            db.ref('teamChats/' + activeWorkerTeam.replace(/[^a-zA-Z0-9]/g, '_')).on('value', snap => {
                const box = document.getElementById('chat-messages');
                box.innerHTML = "";
                if (!snap.exists()) { box.innerHTML = `<p class="text-slate-500 text-center">No messages yet.</p>`; return; }
                snap.forEach(c => {
                    const m = c.val();
                    box.innerHTML += `<div><b class="text-purple-400">${m.sender}:</b> ${m.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendChatMessage() {
            const text = document.getElementById('chat-input').value.trim();
            if (!text) return;
            db.ref('teamChats/' + activeWorkerTeam.replace(/[^a-zA-Z0-9]/g, '_')).push({ sender: activeWorkerId, text, timestamp: new Date().toISOString() })
              .then(() => document.getElementById('chat-input').value = "");
        }

        function uploadPhoto(e, id) {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = ev => {
                db.ref('tasks/' + id).update({ status: 'Completed', photoProof: ev.target.result, completedAt: new Date().toISOString() })
                  .then(() => alert("Photo proof uploaded!"));
            };
            r.readAsDataURL(f);
        }

        function updateTaskStatus(id, status) { db.ref('tasks/' + id).update({ status }); }
        function playChime() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const o = ctx.createOscillator();
            o.frequency.setValueAtTime(587.33, ctx.currentTime);
            o.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.3);
        }
        function handleLogout() { if (watchId) navigator.geolocation.clearWatch(watchId); location.reload(); }
        function changeLanguage(l) {}
    </script>
</body>
</html>
